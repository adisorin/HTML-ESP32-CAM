<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>ESP32-CAM AI Viewer</title>

<style>
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background-color: #2c2f36;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  margin: 0;
  padding-top: 20px;
}

h1 {
  color: white;
  margin-bottom: 15px;
}

.controls {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

button {
  padding: 14px 28px;
  border: none;
  font-size: 18px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

button:hover {
  transform: scale(1.05);
}

.local { background-color: #007bff; color: white; }
.local:hover { background-color: #0056b3; }

.remote { background-color: #28a745; color: white; }
.remote:hover { background-color: #1c7a2d; }

.disconnect { background-color: #dc3545; color: white; }
.disconnect:hover { background-color: #a71d2a; }

.ai-btn { background-color: #00c853; color: white; }
.ai-btn:hover { background-color: #009624; }

.video-frame {
  width: 700px;
  height: 520px;
  border: 3px solid #333;
  border-radius: 12px;
  background-color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 15px;
  position: relative;
}

.video-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
}

.spinner {
  border: 6px solid #ccc;
  border-top: 6px solid #007bff;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.status {
  margin-bottom: 15px;
  font-size: 16px;
  font-weight: 600;
}

.status-wait { color: #00b0ff; }
.status-disconnected { color: #ff5252; }

.ip-list {
  width: 700px;
  background: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  max-height: 180px;
  overflow-y: auto;
}

.ip-list button {
  display: block;
  width: 100%;
  margin: 6px 0;
  text-align: left;
  background-color: #eee;
  color: #333;
  font-size: 16px;
  padding: 12px 18px;
  border-radius: 8px;
}

.ip-list button:hover {
  background-color: #ccc;
}
</style>
</head>

<body>

<h1>ESP32-CAM AI Viewer</h1>

<div class="controls">
  <button class="local" onclick="connectLocal()">Conectare Locală</button>
  <button class="remote" onclick="connectRemote()">Conectare Externă</button>
  <button class="disconnect" onclick="disconnect()">Deconectare</button>
  <button class="ai-btn" onclick="toggleAI()">🧠 Start AI</button>
</div>

<div class="video-frame" id="videoFrame">
  <canvas id="aiCanvas"></canvas>
  <span style="color:#888;">Niciun stream activ...</span>
</div>

<div class="status status-wait" id="status">Aștept conexiune...</div>

<h3 style="color:white;">IP-uri locale disponibile</h3>
<div class="ip-list" id="ipList"></div>

<!-- AI LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
const localIP = "192.168.0.244:81"
const remoteIP = "raisacipi1971445pac2.go.ro:81"

const videoFrame = document.getElementById('videoFrame')
const status = document.getElementById('status')
const ipListDiv = document.getElementById('ipList')

let canvas = document.getElementById("aiCanvas")
let ctx = canvas.getContext("2d")

let currentStream = null
let connectionId = 0
let model = null
let aiRunning = false
let aiLoopTimeout = null
let lastSnapshotTime = 0

const snapshotInterval = 5000      // 5 secunde
const detectionInterval = 200      // AI la 0.4 sec (~2.5 FPS)

// =============================
// IP-uri locale rapide
// =============================
const localIPs = [
  "192.168.0.244:81",
  "192.168.0.245:81",
  "192.168.0.246:81"
]

localIPs.forEach(ip => {
  const btn = document.createElement('button')
  btn.textContent = ip
  btn.onclick = () => connectTo(ip, `Conectat la ${ip}`)
  ipListDiv.appendChild(btn)
})

// =============================
// LOAD AI
// =============================
async function loadAI() {
  status.textContent = "🧠 Se încarcă AI..."
  model = await cocoSsd.load()
  status.textContent = "✅ AI pregătit"
}
loadAI()

// =============================
// TOGGLE AI
// =============================
function toggleAI() {
  aiRunning = !aiRunning

  if (aiRunning) {
    status.textContent = "🧠 AI ACTIV"
    detectLoop()
  } else {
    status.textContent = "⛔ AI OPRIT"
    clearTimeout(aiLoopTimeout)
    ctx.clearRect(0, 0, canvas.width, canvas.height)
  }
}

// =============================
// CONECTARE
// =============================
function connectLocal() {
  connectTo(localIP, "Conectat Local")
}

function connectRemote() {
  connectTo(remoteIP, "Conectat Extern")
}

function connectTo(ip, label) {
  disconnect()
  connectionId++
  const thisId = connectionId

  videoFrame.innerHTML = `<div class="spinner"></div>`
  status.textContent = "Se conectează la " + ip + "..."

  const img = new Image()
  img.crossOrigin = "anonymous"
  img.src = `http://${ip}/stream`

  img.onload = () => {
    if (thisId !== connectionId) return

    videoFrame.innerHTML = ""
    videoFrame.appendChild(img)
    videoFrame.appendChild(canvas)

    // sincronizare rezoluție
    canvas.width = img.width
    canvas.height = img.height

    currentStream = img
    status.textContent = `${label}: http://${ip}/stream`
  }

  img.onerror = () => {
    if (thisId !== connectionId) return
    handleError()
  }
}

function disconnect() {
  connectionId++

  if (currentStream) {
    currentStream.src = ""
    currentStream = null
  }

  aiRunning = false
  clearTimeout(aiLoopTimeout)

  ctx.clearRect(0, 0, canvas.width, canvas.height)
  videoFrame.innerHTML = `<span style='color:red;'>Niciun stream activ...</span>`
  status.textContent = "Deconectat"
}

// =============================
// LOOP AI OPTIMIZAT
// =============================
async function detectLoop() {
  if (!aiRunning || !currentStream || !model) return

  const predictions = await model.detect(currentStream)
  ctx.clearRect(0, 0, canvas.width, canvas.height)

  let detectedLabel = null

  predictions.forEach(p => {
    if (p.score < 0.55) return

    const [x, y, w, h] = p.bbox

    let label = ""
    let color = ""

    if (p.class === "person") {
      label = "om"
      color = "#00ff00"
    } 
    else if (
      ["cat","dog","horse","cow","sheep","bird","elephant","bear","zebra","giraffe"].includes(p.class)
    ) {
      label = "animal"
      color = "#ff0000"
	  
    } 
    else return

    ctx.strokeStyle = color
    ctx.fillStyle = color
    ctx.lineWidth = 4

    ctx.strokeRect(x, y, w, h)
    ctx.font = "bold 18px Arial"
    ctx.fillText(label, x + 5, y - 5)

    detectedLabel = label
  })

  // Snapshot o singură dată pe interval
  if (detectedLabel) {
    const now = Date.now()
    if (now - lastSnapshotTime > snapshotInterval) {
      lastSnapshotTime = now
      saveSnapshot(detectedLabel)
    }
  }

  aiLoopTimeout = setTimeout(detectLoop, detectionInterval)
}

// =============================
// SNAPSHOT
// =============================
function saveSnapshot(label) {
  const tempCanvas = document.createElement("canvas")
  const tempCtx = tempCanvas.getContext("2d")

  tempCanvas.width = canvas.width
  tempCanvas.height = canvas.height

  tempCtx.drawImage(currentStream, 0, 0)
  tempCtx.drawImage(canvas, 0, 0)

  const timestamp = new Date().toISOString().replace(/[:.]/g, "-")
  const fileName = `${label}_${timestamp}.jpg`

  const link = document.createElement("a")
  link.href = tempCanvas.toDataURL("image/jpeg")
  link.download = fileName
  link.click()
}

// =============================
function handleError() {
  disconnect()
  videoFrame.innerHTML =
    `<span style='color:red;font-weight:bold;'>❌ Eroare la conectare!</span>`
  status.textContent = "Conexiune eșuată"
}
</script>


</body>
</html>
